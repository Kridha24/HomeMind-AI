# ==============================================================================
# PRODUCTION SECRET REFERENCE MANIFEST
# NOTE: Real credentials must NEVER be stored in git repositories.
# This template demonstrates ExternalSecrets / SecretStore integration
# (e.g. AWS Secrets Manager, GCP Secret Manager, Vault, or SealedSecrets).
# ==============================================================================

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: homemind-secrets
  namespace: homemind-prod
  labels:
    app.kubernetes.io/name: homemind
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: cloud-secret-store
    kind: ClusterSecretStore
  target:
    name: homemind-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: homemind/production/database
        property: url
    - secretKey: REDIS_URL
      remoteRef:
        key: homemind/production/redis
        property: url
    - secretKey: JWT_SECRET
      remoteRef:
        key: homemind/production/auth
        property: jwt_secret
    - secretKey: JWT_REFRESH_SECRET
      remoteRef:
        key: homemind/production/auth
        property: jwt_refresh_secret
    - secretKey: METRICS_AUTH_TOKEN
      remoteRef:
        key: homemind/production/observability
        property: metrics_token
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: homemind/production/oauth
        property: google_client_id
