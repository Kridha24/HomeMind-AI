apiVersion: apps/v1
kind: Deployment
metadata:
  name: homemind-api
  namespace: homemind-prod
  labels:
    app.kubernetes.io/name: homemind-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: homemind-platform
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: homemind-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homemind-api
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: homemind-api-sa
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: ghcr.io/kridha24/homemind-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: homemind-config
            - secretRef:
                name: homemind-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health/live
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 5001
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5001
            periodSeconds: 5
            failureThreshold: 2
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
