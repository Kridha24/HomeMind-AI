apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: homemind-api-pdb
  namespace: homemind-prod
  labels:
    app.kubernetes.io/name: homemind-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homemind-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: homemind-worker-pdb
  namespace: homemind-prod
  labels:
    app.kubernetes.io/name: homemind-worker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homemind-worker
