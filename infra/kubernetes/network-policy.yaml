apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: homemind-api-netpol
  namespace: homemind-prod
  labels:
    app.kubernetes.io/name: homemind-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: homemind-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress controller to forward external traffic to API
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 5001
    # Allow scraping from Prometheus monitoring namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 5001
  egress:
    # Allow API to communicate with PostgreSQL (port 5432 / 6432)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6432
    # Allow API to communicate with Redis (port 6379)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: homemind-worker-netpol
  namespace: homemind-prod
  labels:
    app.kubernetes.io/name: homemind-worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: homemind-worker
  policyTypes:
    - Ingress
    - Egress
  ingress: [] # Worker does not accept inbound HTTP requests
  egress:
    # Allow Worker to communicate with PostgreSQL (port 5432 / 6432)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6432
    # Allow Worker to communicate with Redis (port 6379)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
