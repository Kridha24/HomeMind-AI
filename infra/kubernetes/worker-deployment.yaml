apiVersion: apps/v1
kind: Deployment
metadata:
  name: homemind-worker
  namespace: homemind-prod
  labels:
    app.kubernetes.io/name: homemind-worker
    app.kubernetes.io/component: background-worker
    app.kubernetes.io/part-of: homemind-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: homemind-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homemind-worker
        app.kubernetes.io/component: background-worker
    spec:
      serviceAccountName: homemind-worker-sa
      # Ample grace period for BullMQ active jobs to finish processing cleanly
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: ghcr.io/kridha24/homemind-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: homemind-config
            - secretRef:
                name: homemind-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
